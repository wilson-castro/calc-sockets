# Ambiente: imagem, dependências, geração de código, build e qualidade.
version: '3'

tasks:
  setup:
    desc: Constrói a imagem, baixa dependências e gera o código protobuf
    cmds:
      - task: image
      - task: gen
      - task: deps
      - task: doctor

  image:
    desc: Constrói a imagem de desenvolvimento (Go, protoc e protoc-gen-go)
    status:
      - '{{if eq .RUNTIME "native"}}true{{else}}false{{end}}'
    cmds:
      - docker compose build dev

  deps:
    desc: Baixa os módulos Go e atualiza go.sum
    cmds:
      - '{{.IN_ENV}} go mod tidy'
      - '{{.IN_ENV}} go mod download'

  gen:
    desc: Gera internal/protocalc/calcpb/calc.pb.go a partir do calc.proto
    sources: [internal/protocalc/calcpb/calc.proto]
    generates: [internal/protocalc/calcpb/calc.pb.go]
    cmds:
      - '{{.IN_ENV}} protoc --go_out=. --go_opt=paths=source_relative internal/protocalc/calcpb/calc.proto'

  build:
    desc: Compila os sete executáveis em bin/
    cmds:
      - >-
        {{.IN_ENV}} sh -c '
        for part in udp tcp proto; do
        go build -o bin/calc-server-$part ./cmd/$part/server &&
        go build -o bin/calc-client-$part ./cmd/$part/client || exit 1;
        done &&
        go build -o bin/calc-experiment ./cmd/experiment'

  lint:
    desc: Confere formatação (gofmt) e análise estática (go vet)
    cmds:
      - '{{.IN_ENV}} sh -c ''unformatted=$(gofmt -l ./cmd ./internal); if [ -n "$unformatted" ]; then echo "arquivos fora do gofmt:"; echo "$unformatted"; exit 1; fi'''
      - '{{.IN_ENV}} go vet ./...'

  fmt:
    desc: Formata o código com gofmt
    cmds:
      - '{{.IN_ENV}} gofmt -w ./cmd ./internal'

  doctor:
    desc: Mostra as versões das ferramentas do ambiente
    cmds:
      - '{{.IN_ENV}} sh -c "go version && protoc --version && protoc-gen-go --version"'

  shell:
    desc: Abre um shell dentro do contêiner de desenvolvimento
    interactive: true
    cmds:
      - docker compose run --rm dev bash

  stop:
    desc: Para tudo o que estiver rodando (servidores, clientes e demos, em contêiner ou no host)
    cmds:
      - docker compose --profile tools --profile clients down --remove-orphans
      # Demos com RUNTIME=native deixam binários de bin/ rodando no host se forem
      # interrompidas antes do fim. O `|| true` evita falha quando não há nenhum.
      - pkill -TERM -f 'bin/calc-(server|client)-' || true

  clean:
    desc: Para a execução e apaga bin/ e dist/ (mantém results/, imagens e caches)
    cmds:
      - task: stop
      - rm -rf bin dist

  purge:
    desc: Limpeza total, que também remove imagens, caches de Go e o Task compilado pelo taskw (exige setup depois)
    prompt: Isso remove as imagens calc-sockets, os volumes de cache e .tools/. Continuar?
    cmds:
      - task: clean
      - docker compose --profile tools --profile clients down --volumes --rmi all --remove-orphans
      - task: :release:clean
      - rm -rf .tools
